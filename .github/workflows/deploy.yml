name: Java CI/CD to Azure VM

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: ./gradlew build -x test

    - name: Configure SSH
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        VM_IP: ${{ secrets.VM_IP }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts

    - name: Copy JAR to Azure VM via SCP
      env:
        VM_IP: ${{ secrets.VM_IP }}
        VM_USER: ${{ secrets.VM_USER }}
      run: |
        scp -i ~/.ssh/id_rsa build/libs/crm-0.0.1-SNAPSHOT.jar $VM_USER@$VM_IP:/home/azureuser/Clothes-CRM/build/libs/

    - name: Restart Spring Boot Service via SSH
      env:
        VM_IP: ${{ secrets.VM_IP }}
        VM_USER: ${{ secrets.VM_USER }}
      run: |
        ssh -i ~/.ssh/id_rsa $VM_USER@$VM_IP "sudo systemctl restart clothes-crm"


