<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Yangi Buyurtma Yaratish')}"></head>
<body>

<header th:replace="~{fragments :: header('orders')}"></header>

<main class="page-container" style="max-width: 800px;">
    <div class="page-header">
        <div>
            <h1 class="page-title">Ulgurji Buyurtma</h1>
            <p class="page-subtitle">Kompaniya kiyim-kechak bazasidan ulgurji partiyani rasmiylashtirish</p>
        </div>
    </div>

    <!-- Error Alerts -->
    <div th:if="${error}" class="alert alert-danger">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${error}">Xatolik yuz berdi!</span>
    </div>

    <div class="dashboard-card">
        <form th:action="@{/orders/create}" method="post">
            
            <div class="form-group">
                <label class="form-label" for="order-product-select">Mahsulotni Tanlang</label>
                <div class="form-control-wrapper">
                    <i class="fa-solid fa-shirt form-control-icon"></i>
                    <select name="productId" id="order-product-select" class="form-select" required>
                        <option th:each="product : ${products}" 
                                th:value="${product.id}" 
                                th:text="${product.name} + ' ($' + ${product.price} + ' - Omborda: ' + ${product.stockQuantity} + ' ta)'"
                                th:data-price="${product.price}"
                                th:selected="${product.id == selectedProductId}">
                            Mahsulot nomi
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="order-quantity">Buyurtma Miqdori (Dona)</label>
                <div class="form-control-wrapper">
                    <i class="fa-solid fa-calculator form-control-icon"></i>
                    <input type="number" name="quantity" id="order-quantity" class="form-control" min="1" value="50" placeholder="Masalan: 100" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="shippingAddress">Yetkazib Berish Manzili</label>
                <div class="form-control-wrapper">
                    <i class="fa-solid fa-truck-ramp-box form-control-icon" style="top: 1.5rem; transform: none;"></i>
                    <textarea name="shippingAddress" id="shippingAddress" class="form-control" rows="4" style="padding-left: 2.75rem; resize: none;" placeholder="To'liq manzil: Mamlakat, shahar, ko'cha, ombor raqami..." required></textarea>
                </div>
            </div>

            <!-- Dynamic price box -->
            <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 1.25rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h4 style="font-weight: 500; color: var(--text-muted);">Umumiy Hisoblangan Summa:</h4>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Yetkazib berish xizmatlari bepul</p>
                </div>
                <div id="order-total-value" style="font-size: 2rem; font-weight: 800; color: var(--accent);">$0.00</div>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn" style="flex: 2;">
                    <i class="fa-solid fa-paper-plane"></i> Buyurtmani Yuborish
                </button>
                <a th:href="@{/dashboard}" class="btn btn-secondary" style="flex: 1;">
                    Bekor Qilish
                </a>
            </div>

        </form>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
