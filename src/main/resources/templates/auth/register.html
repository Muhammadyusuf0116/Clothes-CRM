<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Ro\'yxatdan O\'tish')}"></head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fa-solid fa-shirt"></i> ClothingCRM
            </div>
            <div class="auth-title">Ro'yxatdan O'tish</div>
            <div class="auth-subtitle">Tizimda yangi hamkor hisobini oching</div>
        </div>

        <!-- Alerts -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}">
            <i class="fa-solid fa-circle-exclamation"></i>
            Xatolik yuz berdi!
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="form-group">
                <label class="form-label" for="fullName">Kompaniya / To'liq Nomi</label>
                <div class="form-control-wrapper">
                    <i class="fa-solid fa-building form-control-icon"></i>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="Masalan: Jeans Uz LLC" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Elektron Pochta (Email)</label>
                <div class="form-control-wrapper">
                    <i class="fa-solid fa-envelope form-control-icon"></i>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="nomi@clothing.com" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Maxfiy Parol</label>
                <div class="form-control-wrapper">
                    <i class="fa-solid fa-lock form-control-icon"></i>
                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Kamida 6 ta belgi" required>
                </div>
            </div>

            <button type="submit" class="btn">
                <i class="fa-solid fa-user-plus"></i> Ro'yxatdan O'tish
            </button>
        </form>

        <div class="auth-footer">
            Hisobingiz bormi? <a th:href="@{/login}">Kirish</a>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
