<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${product.id == null ? 'Yangi Mahsulot Qo\'shish' : 'Mahsulotni Tahrirlash'})}"></head>
<body>

<header th:replace="~{fragments :: header('admin-products')}"></header>

<main class="page-container" style="max-width: 800px;">
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${product.id == null ? 'Yangi Mahsulot Qo\'shish' : 'Mahsulotni Tahrirlash'}">Mahsulot Formasi</h1>
            <p class="page-subtitle">Katalogdagi kiyim modelining parametrlarini kiriting</p>
        </div>
    </div>

    <div class="dashboard-card">
        <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label class="form-label" for="name">Mahsulot Nomi</label>
                <div class="form-control-wrapper">
                    <i class="fa-solid fa-shirt form-control-icon"></i>
                    <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Masalan: Slim Fit Denim Jeans" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="sku">SKU kodi (Unikal kod)</label>
                <div class="form-control-wrapper">
                    <i class="fa-solid fa-qrcode form-control-icon"></i>
                    <input type="text" id="sku" th:field="*{sku}" class="form-control" placeholder="Masalan: CLO-J-002" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="category">Kategoriya / Turkum</label>
                <div class="form-control-wrapper">
                    <i class="fa-solid fa-tags form-control-icon"></i>
                    <select id="category" th:field="*{category}" class="form-select" required>
                        <option value="T-Shirts">T-Shirts (Futbolkalar)</option>
                        <option value="Pants">Pants (Shimlar / Jeans)</option>
                        <option value="Outerwear">Outerwear (Kiyimlar / Kurtkalar)</option>
                        <option value="Suits">Suits (Kostyumlar)</option>
                        <option value="Accessories">Accessories (Aksessuarlar)</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label" for="price">Ulgurji Narxi ($)</label>
                    <div class="form-control-wrapper">
                        <i class="fa-solid fa-dollar-sign form-control-icon"></i>
                        <input type="number" id="price" th:field="*{price}" step="0.01" class="form-control" min="0" placeholder="0.00" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="stockQuantity">Ombordagi Qoldiq (Dona)</label>
                    <div class="form-control-wrapper">
                        <i class="fa-solid fa-boxes-stacked form-control-icon"></i>
                        <input type="number" id="stockQuantity" th:field="*{stockQuantity}" class="form-control" min="0" placeholder="0" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="imageUrl">Rasm URL Manzili</label>
                <div class="form-control-wrapper">
                    <i class="fa-solid fa-image form-control-icon"></i>
                    <input type="url" id="imageUrl" th:field="*{imageUrl}" class="form-control" placeholder="https://images.unsplash.com/photo-..." required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Mahsulot Tavsifi (Description)</label>
                <div class="form-control-wrapper">
                    <i class="fa-solid fa-align-left form-control-icon" style="top: 1.5rem; transform: none;"></i>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="4" style="padding-left: 2.75rem; resize: none;" placeholder="Mahsulot matosi, sifati, o'lchamlari haqida batafsil..."></textarea>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn" style="flex: 2;">
                    <i class="fa-solid fa-circle-check"></i> Saqlash
                </button>
                <a th:href="@{/admin/products}" class="btn btn-secondary" style="flex: 1;">
                    Bekor Qilish
                </a>
            </div>

        </form>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
